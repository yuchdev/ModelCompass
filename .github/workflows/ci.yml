name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions; jobs that need more override explicitly.
permissions:
  contents: read

jobs:
  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff format check
        run: uv run ruff format --check .

  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .

  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: MyPy
        run: uv run mypy src tests

  test-matrix:
    name: Pytest Tests Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest -m "not live"

  coverage-gate:
    name: Branch Coverage Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run coverage gate
        run: |
          uv run pytest -m "not live" \
            --cov=model_compass \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90

  docs-build:
    name: Docs Strict Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group docs
      - name: Build docs
        run: uv run mkdocs build --strict

  package-build:
    name: Package Build (using release-saga)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Build package using release-saga
        run: |
          uv run release-saga
          uv build --out-dir dist
      - name: Inspect build artifacts
        run: uv run python scripts/smoke_install.py --dist-dir dist --skip-install
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  smoke-install:
    name: Wheel Smoke Install (using release-saga)
    needs: package-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Download dist artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: dist-artifacts
          path: dist/
      - name: Local install via release-saga
        run: |
          uv run release-saga --local-install
      - name: Smoke test installed wheel in clean environment
        run: |
          uv run python scripts/smoke_install.py --dist-dir dist


name: Release

"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publishing target (testpypi or pypi)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      skip_publish:
        description: "Dry-run build and smoke check without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build & Validate Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Quality gates check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tests
          uv run pytest -m "not live" --cov=model_compass --cov-branch --cov-fail-under=90
      - name: Build package artifacts
        run: |
          uv run release-saga
          uv build --out-dir dist
      - name: Smoke install and artifact inspection
        run: |
          uv run python scripts/smoke_install.py --dist-dir dist
      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 2

  publish-pypi:
    name: Publish to PyPI / TestPyPI
    needs: validate-and-build
    runs-on: ubuntu-latest
    # normal branch pushes cannot publish; only tags or explicit workflow_dispatch
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.skip_publish)
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/p/model-compass' || 'https://pypi.org/p/model-compass' }}
    permissions:
      id-token: write # Mandatory for Trusted Publishing OIDC
      contents: write # For GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Download distribution packages
        uses: actions/download-artifact@v4.1.8
        with:
          name: release-dist
          path: dist/
      - name: Publish to PyPI or TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
          packages-dir: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

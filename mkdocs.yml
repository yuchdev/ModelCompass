site_name: Model Compass
site_description: Request-aware LLM model analytics, comparison, and selection
site_url: https://yuchdev.github.io/ModelCompass
repo_url: https://github.com/yuchdev/ModelCompass

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Concepts:
      - Models: concepts/models.md
      - Pricing: concepts/pricing.md
  - Guides:
      - Catalogs: guides/catalogs.md
      - Analytics and selection: guides/analytics.md
  - Testing: testing.md
  - Testing: testing.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

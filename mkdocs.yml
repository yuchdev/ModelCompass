site_name: Model Compass
site_description: Request-aware LLM model analytics, comparison, and selection
site_url: https://yuchdev.github.io/ModelCompass
repo_url: https://github.com/yuchdev/ModelCompass

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - Decision record: adr/architecture.md
  - Concepts:
      - Models and pricing: adr/lite-concepts-draft.md
      - Models: concepts/models.md
      - Pricing: concepts/pricing.md
      - Request profiles: concepts/request-profile.md
      - Cost estimation: concepts/cost-estimation.md
      - Observations: concepts/observations.md
  - Guides:
      - Catalogs: guides/catalogs.md
      - Analytics and selection: guides/analytics.md
      - Storage: guides/storage.md
  - Testing:
      - Overview: testing.md
      - Taxonomy: qa/testing.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

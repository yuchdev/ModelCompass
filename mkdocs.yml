site_name: Model Compass
site_description: Request-aware LLM model analytics, comparison, and selection
site_url: https://yuchdev.github.io/ModelCompass
repo_url: https://github.com/yuchdev/ModelCompass
site_dir: .site
exclude_docs: README.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Architecture:
      - Overview: architecture.md
      - Decision record: adr/architecture.md
  - Concepts:
      - 01 Models and requests: concepts/01-models.md
      - 02 Pricing: concepts/02-pricing.md
      - 03 Request profiles: concepts/03-request-profile.md
      - 04 Cost estimation: concepts/04-cost-estimation.md
      - 05 Observations: concepts/05-observations.md
      - 06 Selection: concepts/06-selection.md
      - 07 Pareto analysis: concepts/07-pareto.md
      - 08 Quality evidence: concepts/08-quality.md
      - 09 Execution: concepts/09-execution.md
  - Guides:
      - 01 Quickstart: guides/01-quickstart.md
      - 02 Catalogs: guides/02-catalogs.md
      - 03 Offline use: guides/03-offline-use.md
      - 04 Compare models: guides/04-compare-models.md
      - 05 Select a model: guides/05-select-model.md
      - 06 Analytics and selection: guides/06-analytics.md
      - 07 Selection policies: guides/07-selection-policies.md
      - 08 Local storage: guides/08-storage.md
      - 09 Executing with LiteLLM: guides/09-litellm.md
      - 10 Benchmarks: guides/10-benchmarks.md
      - 11 Custom evaluators: guides/11-custom-evaluators.md
      - 12 Releasing: guides/12-releasing.md
      - v0.1 release checklist: release-checklist.md
      - Post-v0.1 backlog: post-v0.1-backlog.md
  - Testing:
      - Overview: testing.md
      - Taxonomy: qa/testing.md
  - Reference:
      - API: reference/api.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

site_name: Model Compass
site_description: Request-aware LLM model analytics, comparison, and selection
site_url: https://yuchdev.github.io/ModelCompass
repo_url: https://github.com/yuchdev/ModelCompass
site_dir: .site
exclude_docs: README.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Architecture:
      - Overview: architecture.md
      - Decision record: adr/architecture.md
  - Concepts:
      - Models and pricing: concepts/models.md
      - Pricing: concepts/pricing.md
      - Request profiles: concepts/request-profile.md
      - Cost estimation: concepts/cost-estimation.md
      - Observations: concepts/observations.md
      - Execution: concepts/execution.md
      - Selection: concepts/selection.md
      - Pareto analysis: concepts/pareto.md
      - Quality evidence: concepts/quality.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - Catalogs: guides/catalogs.md
      - Compare models: guides/compare-models.md
      - Select model: guides/select-model.md
      - Analytics and selection: guides/analytics.md
      - Selection policies: guides/selection-policies.md
      - Storage: guides/storage.md
      - Offline use: guides/offline-use.md
      - Executing with LiteLLM: guides/litellm.md
      - Benchmarks: guides/benchmarks.md
      - Custom evaluators: guides/custom-evaluators.md
      - Releasing: guides/releasing.md
  - Testing:
      - Overview: testing.md
      - Taxonomy: qa/testing.md
  - Reference:
      - API: reference/api.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "model-compass"
version = "0.1.0"
description = "Request-aware LLM model analytics, comparison, and selection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "litellm>=1.0",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/yuchdev/ModelCompass"
Repository = "https://github.com/yuchdev/ModelCompass"
Issues = "https://github.com/yuchdev/ModelCompass/issues"

[project.scripts]
model-compass = "model_compass.cli:app"

[dependency-groups]
dev = [
    "flakeforge==1.1.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "release-saga==1.2.0",
    "respx>=0.21",
    "ruff>=0.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    "DTZ",  # flake8-datetimez
    "PTH",  # flake8-use-pathlib
    "TRY",  # tryceratops
    "PERF", # perflint
]
ignore = [
    "TRY003", # long messages in raise - acceptable for user-facing errors
    "TRY301", # abstract raise in try - common pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests (no network, no external services)",
    "mock: tests using mocked HTTP (respx) or mocked library calls",
    "integration: multi-component tests with temp storage",
    "live: tests that call external APIs (skipped unless credentials present)",
    "slow: tests that take a long time",
]
addopts = [
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["model_compass"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
]
